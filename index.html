<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Empresas · Tablero</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<!-- Solo en celulares y tablets: barra superior fija con el logo -->
<header id="barra-movil" aria-hidden="true">
  <img class="logo-fundar" data-tono="blanco" alt="Fundar">
</header>
<button id="btn-abrir-nav" type="button" aria-label="Mostrar el menú" title="Mostrar el menú"><svg viewBox="0 0 18 14" aria-hidden="true"><rect y="0" width="18" height="2"/><rect y="6" width="18" height="2"/><rect y="12" width="18" height="2"/></svg></button>
<nav id="nav">
  <button id="btn-cerrar-nav" type="button" aria-label="Ocultar el menú" title="Ocultar el menú"><span class="ic-escritorio">&laquo;</span><span class="ic-movil">&times;</span></button>
  <div class="brand">
    <img class="logo-fundar" data-tono="blanco" alt="Fundar">
    <div class="brand-txt">
      <span class="brand-tit">Monitor mensual de empresas</span>
      <small id="ultimo-dato"></small>
    </div>
  </div>
  <div class="navbtns">
    <button class="navbtn" data-vista="resumen" data-simple="Último dato"><span class="navnum">01</span><span class="navtxt">Último dato</span></button>
    <button class="navbtn" data-vista="variaciones" data-simple="Sectores y provincias"><span class="navnum">02</span><span class="navtxt">Variaciones</span></button>
    <button class="navbtn solo-avanzado" data-vista="cascada"><span class="navnum">03</span><span class="navtxt">Aportes (cascada)</span></button>
    <button class="navbtn" data-vista="gobiernos" data-simple="Comparar gobiernos"><span class="navnum">04</span><span class="navtxt">Por gobierno</span></button>
    <button class="navbtn solo-avanzado" data-vista="tamano"><span class="navnum">05</span><span class="navtxt">Por tamaño</span></button>
    <button class="navbtn solo-avanzado" data-vista="largo"><span class="navnum">06</span><span class="navtxt">Largo plazo</span></button>
    <button class="navbtn solo-avanzado" data-vista="ramas"><span class="navnum">07</span><span class="navtxt">Ramas (2 dígitos)</span></button>
    <button class="navbtn" data-vista="mapa" data-simple="Mapa"><span class="navnum">08</span><span class="navtxt">Mapa</span></button>
    <button class="navbtn" data-vista="notas" data-simple="Cómo se mide"><span class="navnum">09</span><span class="navtxt">Metodología y datos</span></button>
  </div>
  <div class="toggles">
    <label class="toggle-row"><span>Modo avanzado</span><button class="switch" id="sw-modo" type="button" aria-label="Modo avanzado" title="Suma pestañas y opciones: aportes, tamaño, largo plazo, ramas a 2 dígitos y todos los controles"></button></label>
    <label class="toggle-row"><span>Modo oscuro</span><button class="switch" id="sw-tema" type="button" aria-label="Modo oscuro"></button></label>
  </div>
</nav>

<main id="contenido"></main>

<!-- Solo en celulares y tablets: botón fijo abajo y hoja de filtros a pantalla completa -->
<button id="btn-filtros" type="button"><svg viewBox="0 0 18 14" aria-hidden="true"><rect y="1" width="18" height="2"/><rect y="6" width="18" height="2"/><rect y="11" width="18" height="2"/><circle cx="5" cy="2" r="2.4"/><circle cx="12" cy="7" r="2.4"/><circle cx="7" cy="12" r="2.4"/></svg>Filtros y opciones</button>
<div id="hoja" role="dialog" aria-modal="true" aria-label="Filtros y opciones del gráfico" hidden>
  <div class="hoja-hd"><b>Filtros y opciones</b><button id="hoja-cerrar" type="button" aria-label="Cerrar">&times;</button></div>
  <div id="hoja-cuerpo"></div>
  <div class="hoja-pie"><button id="hoja-ver" type="button">Ver gráfico</button></div>
</div>

<div id="tooltip" hidden></div>

<script src="logo/logos.js"></script>
<script src="datos/datos.js"></script>
<script src="datos/provincias_geo.js"></script>
<script src="app.js"></script>
</body>
</html>
